<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec dégradé -->
  <defs>
    <linearGradient id="fond-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#3498db" />
    </linearGradient>

    <linearGradient id="cercle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect id="fond" x="0" y="0" width="800" height="600" fill="url(#fond-gradient)" />

  <!-- Éléments à animer -->

  <!-- Cercle à faire bouger -->
  <circle id="cercle-anime" cx="100" cy="100" r="40" fill="url(#cercle-gradient)" stroke="#fff" stroke-width="2" />

  <!-- Rectangle à faire tourner -->
  <rect id="rectangle-tournant" x="200" y="150" width="80" height="80" fill="#27ae60" stroke="#2ecc71" stroke-width="3" />

  <!-- Étoile à transformer -->
  <polygon id="etoile-morph" points="350,100 375,150 425,150 387,185 400,235 350,210 300,235 312,185 275,150 325,150"
           fill="#f1c40f" stroke="#f39c12" stroke-width="2" />

  <!-- Groupe à animer -->
  <g id="groupe-anime" transform="translate(500, 200)">
    <circle cx="0" cy="0" r="30" fill="#9b59b6" />
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Groupe</text>
  </g>

  <!-- Ligne à déformer -->
  <path id="ligne-morph" d="M100 300 L200 350" stroke="#e67e22" stroke-width="4" fill="none" />

  <!-- Texte à animer -->
  <text id="texte-anime" x="400" y="400" text-anchor="middle" fill="#ecf0f1" font-family="Arial" font-size="24" font-weight="bold">
    Animation SVG Ruby
  </text>

  <!-- Petit vaisseau spatial -->
  <g id="vaisseau-spatial" transform="translate(150, 450)">
    <polygon points="0,-15 10,15 -10,15" fill="#95a5a6" />
    <circle cx="0" cy="20" r="5" fill="#e74c3c" />
    <rect x="-3" y="10" width="6" height="8" fill="#34495e" />
  </g>

  <!-- Particules -->
  <circle id="particule1" cx="600" cy="100" r="5" fill="#e74c3c" />
  <circle id="particule2" cx="620" cy="120" r="7" fill="#3498db" />
  <circle id="particule3" cx="640" cy="140" r="6" fill="#2ecc71" />

  <!-- Forme complexe -->
  <path id="forme-complexe" d="M700 300 Q750 250 800 300 T900 300" stroke="#8e44ad" stroke-width="3" fill="none" />
</svg>
